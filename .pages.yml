# Online content editor: https://app.pagescms.org/
# Editable schema; see README.md for repository authorization and publishing.
media:
  - name: papers
    label: 论文 PDF
    input: static/papers
    output: /papers
    extensions:
      - pdf
    rename: random
  - name: slides
    label: 报告幻灯片
    input: static/slides
    output: /slides
    extensions:
      - pdf
      - ppt
      - pptx
    rename: random
  - name: profile_images
    label: 个人头像
    input: assets/media/authors
    output: /media/authors
    extensions:
      - png
      - jpg
      - jpeg
      - webp
    rename: random
content:
  - name: online_publications
    label: 在线论文管理
    type: collection
    path: data/online_publications
    format: json
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.json"
      field: create
    operations:
      create: true
      rename: false
      delete: true
    actions:
      - name: import-publication-by-title
        label: 按标题添加
        scope: collection
        workflow: import-publication.yml
        ref: current
        confirm:
          title: 按标题添加论文
          message: 从 Crossref 查询论文并创建草稿。完成后在论文列表打开草稿，核对后再发布。
          button: 查询并生成草稿
        fields:
          - name: title
            label: 论文完整标题或 DOI
            type: text
            required: true
    view:
      primary: title
      fields:
        - title
        - date
        - draft
      search:
        - title
        - venue
        - doi
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 论文标题
        type: string
        required: true
        description: 填写完整英文标题。首次保存后，修改标题不会改变页面地址。
      - name: draft
        label: 暂存为草稿
        type: boolean
        default: true
        description: 开启时不显示在主页。核对完成后关闭并保存，构建成功后才更新主页。
      - name: bibtex
        label: BibTeX 引用（推荐粘贴）
        type: text
        description: 一次粘贴一条 article 或 inproceedings 记录。构建时自动读取作者、刊物、卷期页码等；下方非空字段可以覆盖引用中的信息。这里不会即时自动填表。
      - name: date
        label: 发表日期
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: 建议明确填写。BibTeX 仅有年月时会暂用该月 1 日；未来日期的论文届时才显示。
      - name: type
        label: 论文类型
        type: select
        options:
          values:
            - name: ""
              label: 从 BibTeX 识别（手工填写时默认为期刊）
            - name: article-journal
              label: 期刊论文
            - name: paper-conference
              label: 会议论文
      - name: authors
        label: 作者与署名（覆盖 BibTeX）
        type: object
        description: 按署名顺序添加，可拖动排序。留空时读取 BibTeX 作者；填写 Chunhui Duan 会自动关联主页作者。
        list:
          max: 100
          collapsible:
            collapsed: false
            summary: "{index}. {name}"
        fields:
          - name: name
            label: 作者姓名
            type: string
            required: true
          - name: note
            label: 作者备注
            type: select
            options:
              values:
                - name: ""
                  label: 普通作者
                - name: Corresponding author
                  label: 通讯作者
                - name: Equal contribution
                  label: 共同第一作者
                - name: Equal contribution; Corresponding author
                  label: 共同第一作者、通讯作者
      - name: venue
        label: 期刊 / 会议全名
        type: string
        description: 留空时读取 BibTeX；没有提供 BibTeX 时必须填写。
      - name: venueShort
        label: 主页显示简称
        type: string
        description: 例如 IEEE TMC、ACM IMWUT (UbiComp)。
      - name: volume
        label: 卷号
        type: string
      - name: issue
        label: 期号
        type: string
      - name: pages
        label: 页码
        type: string
      - name: articleNumber
        label: 文章编号
        type: string
      - name: location
        label: 会议地点
        type: string
      - name: doi
        label: DOI
        type: string
        description: 例如 10.1145/3832013；可留空并从 BibTeX 读取。
      - name: ccfRank
        label: CCF 等级
        type: select
        description: 按标题导入时匹配 CCF 2026 年第七版。会议按主会场匹配，发布前请确认是正式长文。
        options:
          values:
            - name: ""
              label: 不标注
            - name: CCF-A
              label: CCF-A
            - name: CCF-B
              label: CCF-B
            - name: CCF-C
              label: CCF-C
      - name: casRank
        label: 中科院分区
        type: select
        description: 按 ISSN 匹配已核实的 2025 版大类分区，只用于期刊。对照表可在网站设置中维护。
        options:
          values:
            - name: ""
              label: 不标注
            - name: 中科院一区
              label: 中科院一区
            - name: 中科院二区
              label: 中科院二区
            - name: 中科院三区
              label: 中科院三区
            - name: 中科院四区
              label: 中科院四区
      - name: rankingBasis
        label: 导入时的等级依据
        type: text
        readonly: true
        description: 仅在后台供核对。上方两个等级可以手动修改或清空。
      - name: pdfUrl
        label: 论文 PDF
        type: file
        description: 上传或选择站内 PDF。填写后优先使用这个文件。
        options:
          media: papers
          extensions:
            - pdf
          rename: random
      - name: externalPdfUrl
        label: 外部 PDF 链接
        type: string
        description: 按标题导入时会尝试填写公开 PDF 地址。没有站内 PDF 时，网站使用这个 HTTPS 链接。
      - name: slidesUrl
        label: 报告幻灯片
        type: file
        options:
          media: slides
          extensions:
            - pdf
            - ppt
            - pptx
          rename: random
      - name: codeUrl
        label: 代码仓库链接
        type: string
      - name: projectUrl
        label: 项目主页链接
        type: string
      - name: videoUrl
        label: 视频链接
        type: string
      - name: abstract
        label: 论文摘要
        type: text
        description: 按标题导入时会尝试从公开来源填写摘要。发布前可以核对或补充。
      - name: citationEnglish
        label: 自定义英文引用（选填）
        type: text
        description: 留空时生成引用初稿；特殊姓名和引用格式请自行核对。
      - name: citationChinese
        label: 自定义中文引用（选填）
        type: text
      - name: featured
        label: 重点论文
        type: boolean
        default: false
      - name: openAccess
        label: 开放获取
        type: boolean
        default: false
  - name: profile_group
    label: 个人资料
    type: group
    items:
      - name: profile_basic
        label: 个人信息与头像
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: name
            label: 姓名
            type: object
            fields:
              - name: display
                label: 主页显示姓名
                type: string
                description: 例如 Chunhui Duan。论文中的 me 会关联到这个姓名。
                required: true
              - name: given
                label: 名（英文）
                type: string
                description: 用于生成引用和识别论文作者。
                required: true
              - name: family
                label: 姓（英文）
                type: string
                description: 用于生成引用和识别论文作者。
                required: true
              - name: alternate
                label: 中文姓名
                type: string
              - name: pronunciation
                label: 姓名发音（选填）
                type: string
              - name: pronouns
                label: 人称代词（选填）
                type: string
          - name: role
            label: 职称 / 身份
            type: string
            description: 例如 Associate Professor。
          - name: avatar
            label: 个人头像
            type: image
            default: assets/media/authors/me.png
            description: 选择或上传 JPG、PNG、WebP 图片；留空时继续使用原来的默认头像。
            options:
              media: profile_images
              extensions:
                - jpg
                - jpeg
                - png
                - webp
              rename: random
          - name: postnominals
            label: 姓名后缀 / 学位标记
            type: string
            list: true
            description: 例如 PhD、THU；按希望显示的顺序排列。
          - name: bio
            label: 个人简介
            type: text
            description: 支持 Markdown 链接，例如 [学校名称](https://example.com)。现有 <br><br> 换行会保留；也可用空行分段。
      - name: profile_contacts
        label: 单位与联系方式
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: affiliations
            label: 所属单位
            type: object
            fields:
              - name: name
                label: 单位名称
                type: string
                required: true
              - name: url
                label: 单位网站
                type: string
                description: 填写完整 https:// 地址，可留空。
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
          - name: links
            label: 联系与学术主页链接
            type: object
            fields:
              - name: label
                label: 链接名称
                type: string
                description: 例如 E-mail Me、Google Scholar，可留空。
              - name: url
                label: 链接地址
                type: string
                description: 网页链接使用 https://；邮箱使用 mailto:姓名@单位域名。
                required: true
              - name: icon
                label: 图标名称
                type: string
                description: 常用：邮箱 at-symbol；Google Scholar academicons/google-scholar；GitHub brands/github。
            list:
              collapsible:
                collapsed: true
                summary: "{label} {url}"
            description: 按希望在主页显示的顺序排列。
          - name: ids
            label: 学术平台账号
            type: object
            fields:
              - name: google_scholar
                label: Google Scholar 用户 ID
                type: string
                description: 填写 Scholar 链接中 user= 后面的值，并与上方 Google Scholar 链接保持一致。
      - name: profile_interests
        label: 研究方向
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: interests
            label: 研究方向
            type: string
            list: true
            description: 每项填写一个方向；可调整顺序，主页按照此顺序显示。
      - name: profile_education
        label: 教育经历
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: education
            label: 教育经历
            type: object
            fields:
              - name: degree
                label: 学位 / 专业
                type: string
                required: true
              - name: institution
                label: 学校 / 学院
                type: string
                required: true
              - name: start
                label: 开始年月
                type: string
                description: 格式为 YYYY-MM，例如 2013-08。
                pattern:
                  regex: ^[0-9]{4}-(?:0[1-9]|1[0-2])$
                  message: 请输入 YYYY-MM，例如 2013-08。
                required: true
              - name: end
                label: 结束年月
                type: string
                description: 格式为 YYYY-MM；留空表示至今。
                pattern:
                  regex: ^(?:[0-9]{4}-(?:0[1-9]|1[0-2]))?$
                  message: 请输入 YYYY-MM，或留空表示至今。
              - name: summary
                label: 补充说明
                type: text
                description: 支持 Markdown 链接，可留空。
            list:
              collapsible:
                collapsed: true
                summary: "{degree} · {institution}"
            description: 按时间倒序排列，最近的经历放在最前面。
      - name: profile_experience
        label: 工作与学术经历
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: experience
            label: 工作与学术经历
            type: object
            fields:
              - name: role
                label: 职务 / 身份
                type: string
                required: true
              - name: org
                label: 单位 / 机构
                type: string
                required: true
              - name: start
                label: 开始年月
                type: string
                description: 格式为 YYYY-MM，例如 2013-08。
                pattern:
                  regex: ^[0-9]{4}-(?:0[1-9]|1[0-2])$
                  message: 请输入 YYYY-MM，例如 2013-08。
                required: true
              - name: end
                label: 结束年月
                type: string
                description: 格式为 YYYY-MM；留空表示至今。
                pattern:
                  regex: ^(?:[0-9]{4}-(?:0[1-9]|1[0-2]))?$
                  message: 请输入 YYYY-MM，或留空表示至今。
              - name: summary
                label: 补充说明
                type: text
                description: 支持 Markdown 链接，可留空。
            list:
              collapsible:
                collapsed: true
                summary: "{role} · {org}"
            description: 可以添加任职、博士后、科研助理及学术服务经历。结束年月留空时显示至今。
      - name: profile_awards
        label: 基金与奖励
        type: file
        path: data/authors/me.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: awards
            label: 基金与奖励
            type: object
            fields:
              - name: category
                label: 类型
                type: select
                required: true
                options:
                  values:
                    - name: Fund
                      label: 科研基金 / 项目
                    - name: Award
                      label: 奖励 / 荣誉
              - name: title
                label: 完整名称
                type: string
                required: true
              - name: title_en
                label: 基金英文名称（选填）
                type: string
                description: 基金优先显示此名称；奖励仍显示上面的完整名称。
              - name: title_zh
                label: 基金中文名称（选填）
                type: string
                description: 填写后与基金英文名称分行显示。
              - name: awarder
                label: 资助 / 颁奖单位
                type: string
                description: 没有时可留空。
              - name: date
                label: 页面显示日期
                type: string
                description: 保留文字格式，例如 Jan 2026 – Dec 2028、2025；不需要改成完整日期。
              - name: sort_date
                label: 排序日期（选填）
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
                description: 项目可填结束日期，奖励可填获奖日期。仅用于排序；页面仍显示上面的日期文字。
              - name: summary
                label: 角色、经费或获奖说明
                type: text
                description: 例如 **Principal Investigator**<br>RMB 200K；奖励可填写名次或学生姓名。
              - name: icon
                label: 图标名称（选填）
                type: string
                description: 当前紧凑列表未使用图标，可保持留空。
              - name: url
                label: 项目 / 奖励详情链接（选填）
                type: string
                description: 可填写完整 https:// 地址。
            list:
              collapsible:
                collapsed: true
                summary: "{category}: {title}"
            description: 类型决定条目显示在 Funds 或 Awards；删除整项会从主页撤下该条目。
  - name: site_group
    label: 网站设置
    type: group
    items:
      - name: cas_journal_ranks
        label: 中科院期刊分区对照表
        type: file
        path: data/ranking/cas-journals.json
        format: json
        fields:
          - name: journals
            label: 2025 版大类分区
            type: object
            description: 只录入有出处的 2025 版大类分区。每种期刊只保留一条，可填印刷和电子 ISSN。
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {title}"
            fields:
              - name: title
                label: 期刊全名
                type: string
                required: true
              - name: issns
                label: ISSN
                type: string
                list: true
                required: true
                description: 每项一个，例如 0018-9456。
              - name: rank
                label: 大类分区
                type: select
                required: true
                options:
                  values:
                    - 中科院一区
                    - 中科院二区
                    - 中科院三区
                    - 中科院四区
              - name: source
                label: 公开出处
                type: string
                required: true
                description: 填写可核对分区年份和口径的 HTTPS 来源。
      - name: site_navigation
        label: 导航菜单
        type: file
        path: config/_default/menus.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: main
            label: 顶部导航链接
            type: object
            fields:
              - name: name
                label: 显示文字
                type: string
                required: true
              - name: identifier
                label: 内部标识
                type: string
                required: true
                description: 保留已有值。新增导航时使用不同的小写英文标识。
              - name: url
                label: 跳转地址
                type: string
                required: true
                description: 首页板块使用 /#about、/#experience、/#papers、/#funds；外部链接填写完整 https:// 地址。
              - name: weight
                label: 显示顺序
                type: number
                description: 数字越小越靠前。导航显示顺序以此值为准。
            list:
              collapsible:
                collapsed: false
                summary: "{name} → {url}"
      - name: site_appearance
        label: 网站名称与外观
        type: file
        path: config/_default/params.yaml
        format: yaml
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: hugoblox
            label: 网站设置
            type: object
            fields:
              - name: schema
                label: 主题配置版本
                type: string
                hidden: true
                readonly: true
                default: "2.0"
              - name: identity
                label: 网站身份
                type: object
                fields:
                  - name: name
                    label: 网站名称
                    type: string
                    description: 站点身份名称；个人资料中的姓名请在“个人资料”中修改。
                  - name: type
                    label: 身份类型
                    type: string
                    hidden: true
                    readonly: true
                    default: person
              - name: locale
                label: 日期显示
                type: object
                fields:
                  - name: date_format
                    label: 日期显示格式
                    type: select
                    options:
                      values:
                        - name: Jan 2, 2006
                          label: 英文：Nov 4, 2026
                        - name: 2006-01-02
                          label: 数字：2026-11-04
                        - name: 2006年1月2日
                          label: 中文：2026年11月4日
              - name: theme
                label: 主题和颜色
                type: object
                fields:
                  - name: mode
                    label: 明暗模式
                    type: select
                    options:
                      values:
                        - name: system
                          label: 跟随设备
                        - name: light
                          label: 浅色
                        - name: dark
                          label: 深色
                  - name: pack
                    label: 主题风格
                    type: select
                    options:
                      values:
                        - cupcake
                        - default
                        - minimal
                        - marine
                        - matcha
                        - coffee
                        - contrast
                        - dracula
                        - retro
                        - solar
                        - synthwave
                  - name: colors
                    label: 自定义颜色
                    type: object
                    fields:
                      - name: primary
                        label: 主色
                        type: string
                        pattern:
                          regex: ^(#[0-9a-fA-F]{6})?$
                          message: "留空或填写六位十六进制颜色，例如 #3159A6。"
                        description: "留空使用主题默认色；填写 #3159A6 这样的颜色值。"
                      - name: secondary
                        label: 辅助色
                        type: string
                        pattern:
                          regex: ^(#[0-9a-fA-F]{6})?$
                          message: "留空或填写六位十六进制颜色，例如 #3159A6。"
                        description: "留空使用主题默认色；填写 #3159A6 这样的颜色值。"
                      - name: neutral
                        label: 文字与中性色
                        type: string
                        pattern:
                          regex: ^(#[0-9a-fA-F]{6})?$
                          message: "留空或填写六位十六进制颜色，例如 #3159A6。"
                        description: "留空使用主题默认色；填写 #3159A6 这样的颜色值。"
              - name: typography
                label: 字体与字号
                type: object
                fields:
                  - name: pack
                    label: 字体组合
                    type: select
                    options:
                      values:
                        - developer
                        - academic
                        - editorial
                        - geometric
                        - humanist
                        - modern
                        - system
                  - name: font
                    label: 旧字体设置（保留）
                    type: string
                    hidden: true
                    readonly: true
                  - name: size
                    label: 旧字号设置（保留）
                    type: string
                    hidden: true
                    readonly: true
                  - name: families
